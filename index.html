function render(){updateHeader();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===s.tab));let el=$('content');if(s.tab==='home'){el.innerHTML='<p class="sectiontitle">📱 みんなのタイムライン · 自動更新</p><div class="feed">'+s.feed.map(p=>`<article class="post"><div class="posthead"><span class="avatar">${p.type==='hot'?'🔥':p.type==='good'?'💚':'💬'}</span><div><b>${esc(p.name)}</b><div class="handle">@${p.type==='hot'?'watch':'social'}_${p.day}${p.likes%89} · DAY ${p.day}</div></div></div><p>${esc(p.body)}</p><div class="postfoot"><span>♡ ${fmt(p.likes)}</span><span>↻ ${fmt(p.reposts)}</span><span>💬 ${fmt(Math.ceil(p.likes/20))}</span></div></article>`).join('')+'</div>'}else if(s.tab==='trend'){let hot=s.heat>=40;let tags=[hot?'#炎上中':'#今日の話題',s.history.length?'#'+s.history.at(-1).title.replace(/\s/g,''):'#新着投稿',hot?'#説明を求めます':'#平和なTL', '#SNS観察日記'];el.innerHTML='<p class="sectiontitle">🔍 今のトレンド</p>'+tags.map((x,i)=>`<div class="trend"><small>トレンド · ${i+1}位</small><b>${esc(x)}</b><small>${fmt((5-i)*170+r(700)+Math.round(s.heat*15))}件のポスト</small></div>`).join('')}else if(s.tab==='notify'){el.innerHTML='<p class="sectiontitle">🔔 通知 · 最新順</p>'+(s.notifications.length?s.notifications.map(n=>`<div class="historyitem">DAY ${n.day} · ${esc(n.text)}</div>`).join(''):'<p class="empty">まだ通知はありません</p>')}else{el.innerHTML=`<p class="sectiontitle">👤 @survivor のプロフィール</p><div class="post"><div class="big">${fmt(total())} <span class="small">フォロワー</span></div><div class="pillrow"><span class="pill">❤️ 善良 ${fmt(s.good)}</span><span class="pill">👀 野次馬 ${fmt(s.look)}</span><span class="pill">💀 アンチ ${fmt(s.anti)}</span></div><p class="small">炎上対応の記録：${s.incidents}件</p></div><p class="sectiontitle">最近の炎上ログ</p><div class="history">${s.history.slice(-6).reverse().map(h=>`<div class="historyitem">DAY ${h.day} · <b>${esc(h.title)}</b><br>${esc(h.choice)} → ${esc(h.summary)}（🔥 ${h.delta>0?'+':''}${h.delta}%）</div>`).join('')||'<p class="empty">まだ炎上していません</p>'}</ function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function open(html){$('dialog').innerHTML=html;$('modal').classList.remove('hide');clearInterval(timer)}function close(){$('modal').classList.add('hide')}function showIntro(){open(`<div class="eyebrow">SOCIAL MEDIA SURVIVAL</div><h1>🔥 SNS炎上サバイバル<br>2026</h1><p>10日間、炎上ゲージ100%を避けながら、フォロワーをどこまで増やせる？</p><div class="introstep"><span>📱</span><div><b>普段はSNSを眺めるだけ</b><small>タイムラインが自動で動き、日付も自動進行。4つのタブで様子を確認。</small></div></div><div class="introstep"><span>🚨</span><div><b>炎上したら時間が止まる</b><small>投稿を読んで対応を選択。同じ選択でも世間の評価は確率で変化。適切な対応でも燃えることがある。</small></div></div><div class="introstep"><span>👥</span><div><b>炎上で人が集まり、鎮火で離れる</b><small>誠実な対応が認められれば善良なフォロワーが増えることも。</small></div></div><div class="introstep"><span>🏆</span><div><b>DAY 10まで生き残ろう</b><small>100%以上で即敗北。終了時に炎上率・フォロワーの質・称号・性格診断・現実でのSNSアドバイスを表示。</small></div></div><p class="small">想定プレイ時間：約10分（読む速さで変動）。対応の成功確率は炎上率と無関係。約2周に1周、条件を満たすと救済フィーバーが発生します。</p><button class="primary" id="start">ゲームをはじめる →</button>`);$('start').onclick=()=>{s.mode='running';post('はじめまして！今日からSNS活動を始めます。','good','あなた');close();render();resume()}}
function resume(){if(s.mode!=='running')return;clearInterval(timer);timer=setInterval(step,1900)}function step(){if(s.mode!=='running')return;s.tick++;let texts=pick(s.heat>=50?[...generic.hot,...generic.normal]:s.heat<=20?[...generic.normal,...generic.calm]:[...generic.normal,...generic.hot]);post(texts,s.heat>=40&&r(3)!==0?'hot':'normal');if(r(4)===0)post(pick(['今日もよろしく！','写真を投稿しました📸','最近はまってるものを紹介します。','おはようございます☀️']),'good','あなた');if(s.heat<=12){let lost=Math.min(s.look,8+r(26));adjust(0,-lost,0)}else if(s.heat>=45){adjust(0,4+r(18),r(6))}render();if(s.tick===2||s.tick===4||s.tick===6&&r(100)<60){incident();return}if(s.tick>=7){s.tick=0;if(s.day>=10){finish(true);return}s.day++;let drift=s.heat>0?-(2+r(5)):0;changeHeat(drift);if(drift)notify(`話題が少し落ち着き、炎上ゲージ ${drift}%`);render()}}
function incident(){clearInterval(timer);s.mode='event';let available=E.map((x,i)=>i).filter(i=>!s.used.includes(i));if(!available.length){s.used=[];available=E.map((x,i)=>i)}let pool=available.filter(i=>E[i][2]!=='special'||s.day>=3);let id=pick(pool),ev=E[id];s.used.push(id);s.pending={id};let base=ev[2]==='unfair'?9+r(10):ev[2]==='special'?7+r(13):12+r(13);changeHeat(base);let boom=Math.round(base*9+Math.max(0,base-10)*18);adjust(-r(18),boom,r(20));post(`🚨【速報】${ev[0]}で炎上！ ${ev[1]}`,'hot','炎上速報');post(pick(eventPosts(ev)),'hot','検証・切り抜き');post(pick(['ありえないわ、これは説明が欲しい','切り抜きだけで叩くのはどうなん？','また炎上！？何があったの？','元の投稿を確認した人いる？']),'normal','通りすがり');notify(`🚨 ${ev[0]} が拡散中！炎上ゲージ +${base}%`);render();if(s.heat>=100){finish(false);return}open(`<div class="eyebrow">DAY ${s.day} · TRENDING NOW</div><h2>🚨 ${esc(ev[0])}</h2><div class="alert">${esc(ev[1])}<br><span class="small">🔥 炎上発生 +${base}% / 現在 ${s.heat}%</span></div><p><b>あなたはどう対応する？</b></p><div id="options">${ev[3].map((c,i)=>`<button class="choice" data-choice="${i}">${['A','B','C','D'][i]}．${esc(c)}</button>`).join('')}</div><p class="small">どの対応にも鎮火・延焼の可能性あり。確率は現在の炎上率に左右されません。</p>`);$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)))}
const topicPosts={
 bad:['言い逃れする前に説明したら？','これは本人の対応次第では…','擁護したいけど今回の件は厳しいかも','「悪気はなかった」で終わらせないでほしい','【検証】拡散中の投稿を時系列で整理'],
 unfair:['いや、これで叩かれるの理不尽じゃない？','それを理由に燃やすのは無理がある','嫌なら見なきゃよくない？','【速報】ただの写真がなぜか炎上','なんでここまで言われなきゃいけないんだ'],
 past:['【発掘】昔の投稿のスクショが再拡散','過去と今で考えが違うことはあるでしょ','何年前の話を今さら…','これ当時の文脈はどうだったの？','過去のログまで追いかけてる人がいる'],
 fake:['この画像、加工の形跡がない？','【検証】拡散画像の真偽はまだ不明','証拠は？ソースを見せてほしい','切り抜きじゃないの？前後も見ようよ','デマだったら拡散した側も訂正して'],
 chain:['関係ない人まで叩かれてるの地獄','周辺の人を巻き込む必要ある？','【続報】ファン同士でも意見が割れる','本人が何を言っても燃えてない？','引用欄が別の争いになってる'],
 special:['【速報】大手アカウントがこの話題に言及','おすすめ欄こればっかり','なんで急にこんなに伸びたの？','賛否が一気に増えてる','バズに便乗する人が続出']
};
function eventPosts(ev){return [...(topicPosts[ev[2]]||topicPosts.special),`【速報】「${ev[0]}」の件、タイムラインで話題に`,`【切り抜き】${ev[1]} これどう思う？`,`【考察】「${ev[0]}」は本当に問題なのか`]} 
const positivePosts=['説明を読んだら納得した','今の対応は誠実だと思う','これ以上叩く必要ある？','ちゃんと向き合ってるの伝わった','元の文脈見たらだいぶ印象変わった','批判してたけど今回の対応は認める','フォローしてみようかな','冷静に話せる人なんだね','もうここで終わりでいいでしょ','少なくとも今回の対応はよかった'];
const negativePosts=['いや、これはありえないわ','絶対に許すな！！','誠意が感じられないんだけど','それで済むと思ってる？','反省してないように見える','言い訳ばかりで疲れる','もう少しちゃんと説明してほしい','【速報】対応発表も批判が殺到','え、これで終わりにするつもり？','火に油を注いでしまったな','何も分かってないんだろうな','コメント欄が大荒れ'];
const skepticalPosts=['切り抜きで判断するのは危険','情報が足りないから様子見','批判も擁護も極端すぎる','本当のところはどうなんだろう','引用リポストだけ見て決められない','両方の話を聞いてから判断したい'];
function buildReactions(ev,choice,good,large){let pool=good?positivePosts:negativePosts;let main=good?`「${choice}」という対応、評価する人が増えています。`:`「${choice}」は納得できない、という声が広がっています。`;let minority=pick(good?negativePosts:positivePosts);return [`【${good?'続報':'速報'}】「${ev[0]}」について本人が対応を発表`,main,pick(pool),pick(pool),pick(eventPosts(ev)),pick(skepticalPosts),minority,good?'対応を見て応援したくなった':'まだまだ許さないという声が相次ぐ'].map((x,j)=>({text:x,type:j===6?(good?'hot':'good'):good?'good':'hot'}))}
function maybeFever(){if(!s.feverTicket||s.feverUsed||s.day<3||(s.heat<35&&s.day<7))return null;s.feverUsed=true;s.feverCount++;const data=[['📰 検証動画で空気が変わる','拡散されていた情報の見落としが話題に。世間が冷静さを取り戻した。'],['🌟 大物が冷静な意見を投稿','著名人が過剰な攻撃をいさめ、擁護の声が広がった。'],['🕊️ 世間が別の話題へ','炎上を追っていた人たちが別のトレンドに移っていった。'],['💚 過去の対応が再評価','以前の丁寧な説明が再注目され、好意的な投稿が増えた。'],['📣 批判の根拠が再検証される','批判投稿の一部に誤解が見つかり、騒動への見方が変わった。']];let chosen=pick(data),before=s.heat,drop=25+r(16),gain=700+r(1301),spectators=150+r(800);changeHeat(-drop);adjust(gain,spectators,-(30+r(80)));post(`🌈【朗報】${chosen[0]}！ ${chosen[1]}`,'good','トレンド速報');post('えっ、流れ変わってきた？','normal','通りすがり');post('叩きすぎだったかもしれない','good','冷静な人');notify(`🌈 世論逆転フィーバー！ 炎上率 ${before}% → ${s.heat}%`);s.history.push({day:s.day,title:'🌈 '+chosen[0],choice:'フィーバー発生',summary:chosen[1],delta:s.heat-before,heat:s.heat});return {title:chosen[0],desc:chosen[1],before,drop:before-s.heat,gain,spectators}}
function answer(i){let ev=E[s.pending.id],choice=ev[3][i],success=ev[4][i],roll=r(100),good=roll<success,large=good?roll<Math.round(success*.24):roll>success+(100-success)*.61;let delta=good?-(large?17+r(13):5+r(10)):(large?22+r(15):7+r(12));let prev=s.heat;changeHeat(delta);let g,l,a;if(good){g=(large?210:70)+r(large?540:180);l=-(40+r(large?200:80));a=-(5+r(large?65:28))}else{g=-(20+r(large?165:65));l=(large?760:220)+r(large?1400:420);a=(large?210:55)+r(large?450:130)}if(ev[2]==='special'&&good){g+=120+r(330);l+=150+r(450)}adjust(g,l,a);s.incidents++;let key=/謝|お詫|配慮|認め/.test(choice)?'apology':/説明|証拠|確認|公開|伝える|案内|訂正|修正/.test(choice)?'explain':/静観|無視|黙|放置|反応しない|控える/.test(choice)?'ignore':'attack';s.answers[key]++;let reactions=buildReactions(ev,choice,good,large);let summary=good?(large?'多くのユーザーが対応を認め、炎上が大きく落ち着いています。':'対応が一定の理解を得て、炎上が落ち着きつつあります。'):(large?'多数のユーザーが怒りを示し、批判が一気に拡散しています！':'対応に納得しない人が増え、炎上が広がっています。');s.history.push({day:s.day,title:ev[0],choice,summary,delta,heat:s.heat});s.pending=null;reactions.forEach(v=>post(v.text,v.type,v.text.startsWith('【')?'まとめ速報':null));let fever=maybeFever();notify(`${good?'🕊️':'🔥'} ${summary} 炎上 ${delta>0?'+':''}${delta}%`);render();s.mode='reaction';open(`<div class="eyebrow">PUBLIC REACTION · DAY ${s.day}</div><h2>${good?'🕊️ 鎮火の兆し':'🔥 さらに延焼！'}</h2><p>あなたの対応：<b>${esc(choice)}</b></p>${reactions.map(v=>`<div class="reaction">${v.text.startsWith('【')?'📢':'👤'} ${esc(v.text)}</div>`).join('')}<div class="alert"><b>${esc(summary)}</b></div>${fever?`<div class="feverbox"><h2>🌈 世論逆転フィーバー！</h2><b>${esc(fever.title)}</b><p>${esc(fever.desc)}</p><strong>🔥 -${fever.drop}%　❤️ +${fmt(fever.gain)}人</strong></div>`:""}<div class="delta">🔥 炎上ゲージ <b class="${delta>0?'neg':'pos'}">${delta>0?'+':''}${delta}%</b>（${prev}% → ${s.heat}%${fever?"・フィーバー込み":""}）<br>❤️ 善良 <span class="${g>=0?'pos':'neg'}">${g>0?'+':''}${fmt(g)}</span>　👀 野次馬 <span class="${l>=0?'pos':'neg'}">${l>0?'+':''}${fmt(l)}</span><br>💀 アンチ <span class="${a>=0?'pos':'neg'}">${a>0?'+':''}${fmt(a)}</span>　👥 総数 <b>${fmt(total())}</b></div><button class="primary" id="next">${s.heat>=100?'結果を見る':'SNSに戻る →'}</button>`);$('next').onclick=()=>{if(s.heat>=100){finish(false)}else{s.mode='running';close();render();resume()}}}
function title(){let q=s.good/Math.max(1,total()),a=s.anti/Math.max(1,total());if(s.heat>=100)return'💀 大炎上で退場';if(s.heat>=80)return'🔥 崖っぷちの炎上王';if(q>=.72)return'💚 愛される誠実派';if(a>=.3)return'💀 監視される有名人';if(s.look/Math.max(1,total())>=.55)return'👀 野次馬のスター';if(total()>=12000)return'🚀 話題を操る生存者';return'🕊️ しぶとい生存者'}function diagnosis(){const x=s.answers,m=Math.max(...Object.values(x)),type=Object.keys(x).find(k=>x[k]===m);return {apology:['🤝 誠実な調停者','相手の気持ちを優先し、関係修復を試みる傾向。謝りすぎず、事実確認も忘れずに。'],explain:['🔎 論理的な説明役','根拠と文脈を伝えて解決を目指す傾向。長文で反論を重ねる前に、要点を絞ろう。'],ignore:['🧊 静観型の観察者','衝突を避け、様子を見る傾向。デマや実害があるときは、必要な訂正まで控えないように。'],attack:['⚡ 強気な突破者','自分の立場をはっきり示す傾向。反射的な返信を少し置くと、余計な対立を避けやすい。']}[type]||['🎭 臨機応変タイプ','状況に応じて対応を使い分ける傾向。']}function finish(win){clearInterval(timer);s.mode='over';render();let [person,desc]=diagnosis(),quality=total()?Math.round(s.good/total()*100):0;open(`<div class="eyebrow">FINAL REPORT · ${win?'SURVIVED':'GAME OVER'}</div><h1>${win?'🏆 10日間生存！':'💥 炎上ゲージ100%突破'}</h1><h2>${title()}</h2><p>${win?'炎上の波を乗り切り、10日間の活動が終了しました。':'対応が追いつかない規模の炎上に発展しました。'}</p><div class="resultgrid"><div><small>🔥 最終炎上ゲージ</small><b>${s.heat}%</b></div><div><small>👥 最終フォロワー</small><b>${fmt(total())}</b></div><div><small>❤️ 善良</small><b>${fmt(s.good)}</b></div><div><small>👀 野次馬</small><b>${fmt(s.look)}</b></div><div><small>💀 アンチ</small><b>${fmt(s.anti)}</b></div><div><small>💚 善良比率</small><b>${quality}%</b></div></div><p class="small">到達：DAY ${s.day} ／ 対応 ${s.incidents}件 ／ 最大炎上率 ${s.maxHeat}% ／ フィーバー ${s.feverCount}回</p><h2>🧠 SNS対応 性格診断</h2><div class="advice"><b>${person}</b><br>${desc}<br><span class="small">※ゲーム内の選択傾向による娯楽的な診断であり、心理学的な検査ではありません。</span></div><h2>💡 リアルではこうしよう</h2><div class="advice">${s.answers.attack>=s.answers.apology+s.answers.explain?'まず投稿前に少し時間を置き、強い言葉での応酬を避けよう。':s.answers.ignore>=s.incidents*.5?'静観が有効な場合もあるけれど、誤情報や実害には必要最小限の事実訂正を。':'事実関係を確認し、必要なら簡潔に謝罪・訂正しよう。'}<br>無実の批判には無理に謝らず、証拠を保全。個人情報を晒さず、脅迫や継続的な嫌がらせはプラットフォームへの通報や専門家への相談を検討してね。</div><h2>📝 最終ログ</h2><div class="history">${s.history.slice().reverse().map(h=>`<div class="historyitem">DAY ${h.day}｜${esc(h.title)}<br><span class="small">${esc(h.choice)} → ${esc(h.summary)} 🔥${h.delta>0?'+':''}${h.delta}%</span></div>`).join('')}</div><button class="primary" id="again">もう一度遊ぶ ↻</button><button class="secondary" id="viewTimeline">最終タイムラインを見る</button>`);$('again').onclick=reset;$('viewTimeline').onclick=()=>{close();s.tab='home';render()}}
$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{s.tab=b.dataset.tab;render()}));reset();})();
